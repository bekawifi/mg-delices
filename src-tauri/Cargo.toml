[package]
name = "restopro"
version = "1.1.1"
description = "RestoPRO - gestion professionnelle de restaurant"
authors = ["RestoPRO"]
edition = "2021"

[lib]
name = "restopro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "=2.9.0"
